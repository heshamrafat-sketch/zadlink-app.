<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>زاد لينك (ZadLink) — المنصة الموحدة للطعام ومستلزمات البيت والتوريد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #020617;
      --panel: #0b1222;
      --card: #0f172a;
      --line: rgba(148, 163, 184, 0.16);
      --text: #f8fafc;
      --muted: #94a3b8;
      --emerald: #10b981;
      --emerald-bright: #34d399;
      --emerald-soft: #6ee7b7;
      --amber: #fbbf24;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 86px;
      background: var(--bg);
    }

    body {
      margin: 0;
      font-family: 'Alexandria', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.75;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 15% 0%, rgba(16, 185, 129, 0.16), transparent 44%),
        radial-gradient(ellipse at 85% 15%, rgba(5, 150, 105, 0.1), transparent 40%),
        var(--bg);
      overflow-x: clip;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin-inline: auto;
    }

    /* الشريط العلوي */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      min-height: 74px;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      padding: 10px 0;
    }

    .nav-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--emerald-soft), var(--emerald));
      color: #022c22;
      font-weight: 800;
      font-size: 18px;
    }

    .brand b {
      display: block;
      font-size: 17px;
      font-weight: 800;
    }

    .brand small {
      display: block;
      font-size: 9px;
      letter-spacing: 2.5px;
      color: var(--emerald-soft);
      font-weight: 700;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: #cbd5e1;
      flex-wrap: wrap;
    }

    .nav-links a:hover {
      color: var(--emerald-soft);
    }

    .cart-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid rgba(16, 185, 129, 0.35);
      background: rgba(16, 185, 129, 0.14);
      color: #d1fae5;
      font-size: 12px;
      font-weight: 700;
    }

    .cart-pill em {
      font-style: normal;
      min-width: 22px;
      height: 22px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--emerald);
      color: #022c22;
      font-size: 11px;
      font-weight: 800;
    }

    /* القسم الرئيسي */
    .hero {
      padding: 40px 0 20px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
      align-items: start;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 13px;
      border-radius: 999px;
      border: 1px solid rgba(16, 185, 129, 0.28);
      background: rgba(16, 185, 129, 0.1);
      color: var(--emerald-soft);
      font-size: 11px;
      font-weight: 600;
    }

    h1 {
      margin: 14px 0 10px;
      font-size: clamp(25px, 4vw, 44px);
      line-height: 1.32;
      font-weight: 800;
    }

    h1 span,
    h2 span {
      color: var(--emerald-bright);
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .btn-primary {
      border: 0;
      border-radius: 12px;
      padding: 11px 18px;
      background: linear-gradient(135deg, var(--emerald-bright), #059669);
      color: #022c22;
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .btn-secondary {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 15px;
      background: var(--card);
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 600;
    }

    .hero-cards {
      display: grid;
      gap: 12px;
      padding: 18px;
      border-radius: 22px;
      border: 1px solid rgba(16, 185, 129, 0.22);
      background: radial-gradient(circle at 50% 20%, rgba(16, 185, 129, 0.18), transparent 65%), var(--panel);
    }

    .info-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 15px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid var(--line);
    }

    .info-card > span {
      font-size: 20px;
    }

    .info-card b {
      display: block;
      font-size: 12.5px;
    }

    .info-card small {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .stats-bar {
      margin-top: 24px;
      padding: 16px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .stats-bar strong {
      display: block;
      font-size: 18px;
      color: var(--emerald-bright);
    }

    .stats-bar span {
      font-size: 11px;
      color: var(--muted);
    }

    /* الأقسام والبطاقات */
    .section {
      padding: 40px 0;
    }

    .panel {
      border: 1px solid rgba(16, 185, 129, 0.22);
      border-radius: 24px;
      padding: 22px;
      background: linear-gradient(145deg, var(--card), #080e1b);
      display: grid;
      gap: 18px;
    }

    .panel-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .panel-head h2 {
      margin: 6px 0 0;
      font-size: clamp(20px, 3vw, 30px);
    }

    .switch-group {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border-radius: 12px;
      background: #060c18;
      border: 1px solid #1e293b;
      flex-wrap: wrap;
    }

    .switch-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 13px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 700;
    }

    .switch-btn.active {
      background: #059669;
      color: #ffffff;
    }

    .role-tabs-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 6px;
      border-radius: 14px;
      background: #060c18;
      border: 1px solid #1e293b;
    }

    .role-tab-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .role-tab-btn.active {
      background: linear-gradient(135deg, var(--emerald-bright), #059669);
      color: #022c22;
      font-weight: 800;
    }

    .reg-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 18px;
      align-items: start;
    }

    .sub-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      background: rgba(2, 6, 23, 0.65);
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
      font-size: 12px;
      color: #e2e8f0;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 11px;
      background: #060c18;
      color: var(--text);
      padding: 10px 12px;
      font-size: 12px;
    }

    .feat-list {
      display: grid;
      gap: 10px;
    }

    .feat-item {
      border: 1px solid rgba(16, 185, 129, 0.22);
      border-radius: 14px;
      padding: 12px;
      background: rgba(15, 23, 42, 0.85);
      display: grid;
      gap: 4px;
    }

    .feat-item strong {
      font-size: 12.5px;
      color: var(--emerald-soft);
    }

    .feat-item small {
      font-size: 11px;
      color: var(--muted);
    }

    .members-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .member-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: rgba(15, 23, 42, 0.85);
      display: grid;
      gap: 6px;
      font-size: 11.5px;
    }

    .role-tag {
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.16);
      color: var(--emerald-soft);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .merchants-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .merchant-card {
      border: 1px solid var(--line);
      background: rgba(2, 6, 23, 0.65);
      border-radius: 16px;
      padding: 14px;
      color: var(--text);
      text-align: right;
    }

    .merchant-card.selected {
      border-color: var(--emerald-bright);
      background: rgba(6, 78, 59, 0.28);
    }

    .merchant-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 10.5px;
      color: var(--muted);
    }

    .merchant-card strong {
      display: block;
      margin: 6px 0 3px;
      font-size: 13.5px;
    }

    .merchant-card small {
      display: block;
      font-size: 10.5px;
      color: #cbd5e1;
    }

    .stages-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .stage-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: rgba(2, 6, 23, 0.5);
      opacity: 0.65;
    }

    .stage-card.done {
      opacity: 1;
      border-color: rgba(52, 211, 153, 0.45);
      background: rgba(6, 78, 59, 0.2);
    }

    .stage-card strong {
      display: block;
      font-size: 12px;
      margin: 5px 0 2px;
    }

    .stage-card small {
      font-size: 10.5px;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid #1e293b;
      background: var(--card);
      min-width: 220px;
    }

    .search-box input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 12px;
    }

    .chips-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
    }

    .chip {
      white-space: nowrap;
      border: 1px solid #1e293b;
      background: var(--panel);
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 11px;
    }

    .chip.active {
      background: #064e3b;
      border-color: #059669;
      color: #a7f3d0;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .product-card {
      border: 1px solid #1e293b;
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(150deg, rgba(15, 23, 42, 0.96), rgba(7, 14, 27, 0.98));
      display: flex;
      flex-direction: column;
    }

    .product-media {
      height: 155px;
      position: relative;
      display: grid;
      place-items: center;
      background: var(--panel);
      overflow: hidden;
    }

    .product-media img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 2;
    }

    .product-media span {
      font-size: 50px;
      z-index: 1;
    }

    .product-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .product-body .cat {
      font-size: 10.5px;
      color: var(--emerald-bright);
      font-weight: 600;
    }

    .product-body h3 {
      margin: 4px 0;
      font-size: 14.5px;
    }

    .product-body p {
      margin: 0 0 12px;
      font-size: 11px;
      color: var(--muted);
      flex: 1;
    }

    .product-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .product-foot strong {
      display: block;
      font-size: 16px;
    }

    .product-foot small {
      font-size: 10px;
      color: var(--muted);
    }

    .add-btn {
      border: 1px solid rgba(16, 185, 129, 0.35);
      background: rgba(16, 185, 129, 0.16);
      color: var(--emerald-soft);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 700;
    }

    .order-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid #1e293b;
      border-radius: 24px;
      overflow: hidden;
      background: var(--panel);
    }

    .payment-col {
      padding: 24px;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .form-col {
      padding: 24px;
      background: linear-gradient(145deg, #064e3b, #052e2b);
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .form-col h3 {
      margin: 0;
      font-size: 19px;
    }

    .form-col input,
    .form-col textarea {
      width: 100%;
      border: 1px solid rgba(167, 243, 208, 0.25);
      border-radius: 11px;
      background: rgba(2, 6, 23, 0.6);
      color: var(--text);
      padding: 10px 12px;
      font-size: 12px;
    }

    .cart-preview {
      border-radius: 14px;
      background: rgba(2, 6, 23, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.22);
      padding: 12px;
      font-size: 11.5px;
      display: grid;
      gap: 8px;
    }

    .cart-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .qty-controls {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .qty-controls button {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      border: 1px solid rgba(167, 243, 208, 0.3);
      background: rgba(16, 185, 129, 0.2);
      color: #fff;
      font-weight: 700;
    }

    .role-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .role-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: rgba(2, 6, 23, 0.6);
      display: grid;
      gap: 6px;
    }

    .action-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .small-btn {
      border: 1px solid rgba(16, 185, 129, 0.35);
      background: rgba(16, 185, 129, 0.14);
      color: var(--emerald-soft);
      border-radius: 9px;
      padding: 6px 10px;
      font-size: 10.5px;
      font-weight: 700;
    }

    .small-btn.primary {
      background: #059669;
      color: #fff;
      border-color: #059669;
    }

    .receipt-box {
      border: 1px solid rgba(52, 211, 153, 0.45);
      border-radius: 18px;
      padding: 16px;
      background: rgba(6, 78, 59, 0.22);
      display: grid;
      gap: 8px;
      font-size: 12px;
    }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 18px;
      z-index: 60;
      max-width: 420px;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--card);
      border: 1px solid #1e293b;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 20px 0;
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 820px) {
      .hero-grid,
      .merchants-grid,
      .products-grid,
      .order-grid,
      .role-grid,
      .reg-grid,
      .members-grid,
      .role-tabs-grid {
        grid-template-columns: 1fr;
      }

      .stages-grid,
      .stats-bar {
        grid-template-columns: repeat(2, 1fr);
      }

      .nav-links {
        display: none;
      }
    }
  </style>
</head>
<body>

    // حساب الأرباح التلقائية لكل طلب للإدارة والتاجر والدليفري
    function computeOrderProfits(order) {
      const amount = Number(order.total || 0);
      const fee = order.deliveryMode === 'delivery' ? Number(order.deliveryFee || 15) : 0;
      const adminProfit = Math.round(amount * 0.1 * 100) / 100;
      const courierProfit = order.deliveryMode === 'delivery' ? fee : 0;
      const merchantProfit = Math.max(0, Math.round((amount - adminProfit - courierProfit) * 100) / 100);
      return { adminProfit, merchantProfit, courierProfit };
    }

      const canViewProfits = activeRole !== 'customer';

      function pushBroadcast(kind, text) {
        const clean = text.trim();
        if (!clean) return;
        setBroadcasts((prev) => [{ id: `b-${Date.now()}`, kind, text: clean }, ...prev].slice(0, 8));
        setToast({ text: `[إشعار للكل • ${kind}] ${clean}`, error: false });

        try {
          fetch(`${SUPABASE_URL}/rest/v1/notifications`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`,
              Prefer: 'return=minimal',
            },
            body: JSON.stringify({
              target_role: 'all',
              title: kind,
              message: clean,
            }),
          }).catch(() => {});
        } catch (_err) {
          // تجاهل أخطاء الشبكة الخلفية للإشعارات الاختيارية
        }
      }

      useEffect(() => {
        if (!toast || toast.error) return;
        const timer = setTimeout(() => setToast(null), 4500);
        return () => clearTimeout(timer);
      }, [toast]);

      const merchant = useMemo(
        () => MERCHANTS.find((m) => m.id === merchantId) || MERCHANTS[0],
        [merchantId]

      const categories = useMemo(
        () => ['الكل', ...Array.from(new Set(PRODUCTS.map((p) => p.category)))],
        []

      const getPrice = (p) => (customerType === 'wholesale' ? p.wholesale : p.retail);

      const filteredProducts = useMemo(() => {
        const q = query.trim().toLowerCase();
        return PRODUCTS.filter((p) => {
          const matchCat = category === 'الكل' || p.category === category;
          const matchQ = !q || p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
          return matchCat && matchQ;
        });
      }, [category, query]);

      const totalCount = cart.reduce((acc, item) => acc + item.qty, 0);
      const subtotal = cart.reduce((acc, item) => acc + getPrice(item.product) * item.qty, 0);
      const deliveryFee =
        deliveryMode === 'pickup' || totalCount === 0 || customerType === 'wholesale'

          : merchant.fee;
      const grandTotal = subtotal + deliveryFee;

      const ledgerTotals = useMemo(() => {
        return orders.reduce(
          (acc, ord) => {
            const p = computeOrderProfits(ord);
            return {
              admin: Math.round((acc.admin + p.adminProfit) * 100) / 100,
              merchant: Math.round((acc.merchant + p.merchantProfit) * 100) / 100,
              courier: Math.round((acc.courier + p.courierProfit) * 100) / 100,
            };
          },
          { admin: 0, merchant: 0, courier: 0 }
        );
      }, [orders]);

      function addItem(product) {
        setCart((prev) => {
          const existing = prev.find((i) => i.product.id === product.id);
          if (existing) {
            return prev.map((i) =>
              i.product.id === product.id ? { ...i, qty: i.qty + 1 } : i
            );
          }
          return [...prev, { product, qty: 1 }];
        });
        setToast({ text: `تمت إضافة "${product.name}" للسلة`, error: false });
      }

        setCart((prev) =>

      }

          prev.map((o) => (o.code === code ? { ...o, stageIndex: nextStage } : o))

          phone: regPhone.trim(),

          setRegStoreName('');
          setRegZone('');

          setRegistering(false);

      async function submitOrder(e) {
        e.preventDefault();
        setToast(null);

        if (!customerName.trim() || !phone.trim()) {
          setToast({ text: 'يرجى إدخال اسم العميل ورقم الهاتف أولاً.', error: true });
          return;
        }

        const effectiveTotal = grandTotal > 0 ? grandTotal : 150;
        const orderCode = `ZL-${Math.floor(10000 + Math.random() * 90000)}`;

        const itemsText = cart.length
          ? cart
              .map((i) => `${i.product.name} (${i.qty} ${i.product.unit} × ${getPrice(i.product)} ج.م)`)

        const paymentText =

        const deliveryText =

          notes.trim() ? `ملاحظات: ${notes.trim()}` : null,

        setSubmitting(true);
        try {

            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`,

              phone: phone.trim(),

            phone: phone.trim(),
            accountType: customerType === 'wholesale' ? 'تاجر جملة' : 'عميل قطاعي',
