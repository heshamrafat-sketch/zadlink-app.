<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>زاد لينك (ZadLink) — كل احتياجات الطعام ومستلزمات البيت والسوبر ماركت</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      font-family: 'Alexandria', Arial, sans-serif;
      color: #f8fafc;
      background-color: #020617;
      --emerald: #10b981;
      --muted: #94a3b8;
      --line: rgba(148, 163, 184, 0.14);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 90px; background: #020617; }
    body { margin: 0; background: #020617; color: #f8fafc; }
    button, input, textarea { font: inherit; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; }
    .app-shell {
      overflow: hidden;
      background: radial-gradient(ellipse at 15% 0%, rgba(16, 185, 129, 0.16), transparent 42%), #020617;
      min-height: 100vh;
    }
    .container { width: min(1160px, calc(100% - 36px)); margin-inline: auto; }
    .topbar {
      height: 76px;
      border-bottom: 1px solid var(--line);
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .nav-wrap { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center;
      color: #052e24; background: linear-gradient(145deg, #6ee7b7, #10b981); font-weight: 800;
    }
    .brand b { display: block; font-size: 18px; font-weight: 800; }
    .brand small { display: block; font-size: 9px; letter-spacing: 2.5px; color: #6ee7b7; font-weight: 700; }
    .nav-links { display: flex; align-items: center; gap: 22px; color: #aab7c8; font-size: 12px; }
    .nav-links a:hover { color: #6ee7b7; }
    .cart-button {
      display: flex; align-items: center; gap: 8px; border: 1px solid rgba(16, 185, 129, 0.35);
      background: rgba(16, 185, 129, 0.14); color: #d1fae5; border-radius: 12px; padding: 9px 13px; font-size: 12px; font-weight: 600;
    }
    .cart-button em {
      font-style: normal; background: #10b981; color: #022c22; border-radius: 7px;
      min-width: 20px; height: 20px; display: grid; place-items: center; font-size: 11px; font-weight: 800;
    }
    .mobile-menu { display: none; background: #0f172a; border: 1px solid #1e293b; border-radius: 10px; color: #f8fafc; width: 38px; height: 38px; }
    .hero { padding: 56px 0 24px; }
    .hero-grid { display: grid; grid-template-columns: 1.05fr 0.95fr; align-items: center; gap: 36px; }
    .eyebrow, .section-kicker { color: #6ee7b7; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
    .eyebrow { padding: 8px 14px; border: 1px solid rgba(16, 185, 129, 0.28); background: rgba(16, 185, 129, 0.1); border-radius: 99px; }
    h1 { font-size: clamp(30px, 4.3vw, 52px); line-height: 1.32; margin: 18px 0 14px; font-weight: 800; }
    h1 span, h2 span { color: #34d399; }
    .hero-copy > p, .trade-intro > p, .contact-copy > p { font-size: 13px; line-height: 2; color: #94a3b8; margin: 0; }
    .hero-buttons { display: flex; align-items: center; gap: 16px; margin-top: 24px; flex-wrap: wrap; }
    .primary-button {
      border: 0; border-radius: 13px; padding: 12px 20px; background: linear-gradient(135deg, #34d399, #059669);
      color: #022c22; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px;
    }
    .text-button { font-size: 12px; color: #cbd5e1; }
    .hero-visual {
      min-height: 300px; border-radius: 26px; border: 1px solid rgba(16, 185, 129, 0.2);
      background: radial-gradient(circle at 50% 35%, rgba(16, 185, 129, 0.2), transparent 60%), #0b1222;
      padding: 24px; display: grid; gap: 14px; align-content: center;
    }
    .floating-box {
      display: flex; align-items: center; gap: 12px; background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.18); border-radius: 16px; padding: 14px;
    }
    .floating-box span { font-size: 24px; }
    .floating-box b { display: block; font-size: 13px; }
    .floating-box small { display: block; font-size: 11px; color: #94a3b8; margin-top: 3px; }
    .hero-stats {
      margin-top: 38px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
      padding: 18px 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
    }
    .hero-stats strong { display: block; font-size: 20px; color: #34d399; }
    .hero-stats span { font-size: 11px; color: #94a3b8; }
    .section { padding: 68px 0; }
    .trade-panel {
      border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 24px; padding: 28px;
      background: linear-gradient(145deg, #0f172a, #080e1b); display: grid; gap: 22px;
    }
    .customer-type-switch {
      display: inline-flex; background: #0f172a; border: 1px solid #1e293b; padding: 4px; border-radius: 12px; gap: 4px; flex-wrap: wrap;
    }
    .type-pill {
      border: 0; background: transparent; color: #94a3b8; padding: 8px 14px; border-radius: 9px; font-size: 11px; font-weight: 700;
    }
    .type-pill.active { background: #059669; color: #fff; }
    .metrics-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .metric-card {
      border: 1px solid rgba(148, 163, 184, 0.15); background: rgba(2, 6, 23, 0.6);
      border-radius: 16px; padding: 16px; color: #f8fafc; text-align: right;
    }
    .metric-card.active-merchant { border-color: #34d399; background: rgba(6, 78, 59, 0.28); }
    .metric-top { display: flex; justify-content: space-between; font-size: 10.5px; color: #94a3b8; }
    .metric-card strong { display: block; font-size: 15px; margin: 10px 0 4px; }
    .metric-card small { display: block; font-size: 10.5px; color: #94a3b8; }
    .steps-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .section-heading { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    .search-box {
      display: flex; align-items: center; gap: 8px; border: 1px solid #1e293b; background: #0f172a;
      border-radius: 12px; padding: 0 12px; height: 42px; min-width: 220px;
    }
    .search-box input { flex: 1; border: 0; outline: 0; background: transparent; color: #f8fafc; font-size: 12px; }
    .category-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 14px; }
    .category-chip {
      white-space: nowrap; border: 1px solid #1e293b; background: #0b1222; color: #94a3b8;
      border-radius: 10px; padding: 8px 14px; font-size: 11px;
    }
    .category-chip.active { background: #064e3b; border-color: #059669; color: #a7f3d0; }
    .product-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .product-card {
      border: 1px solid #1e293b; background: linear-gradient(150deg, rgba(15, 23, 42, 0.96), rgba(7, 14, 27, 0.98));
      border-radius: 20px; overflow: hidden; display: flex; flex-direction: column;
    }
    .product-image {
      height: 175px; position: relative; display: grid; place-items: center; overflow: hidden; background: #0b1222;
    }
    .product-image img { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 2; }
    .product-emoji { font-size: 56px; z-index: 1; }
    .product-info { padding: 16px; display: flex; flex-direction: column; flex: 1; }
    .product-category { font-size: 10.5px; color: #34d399; font-weight: 600; }
    .product-info h3 { font-size: 15px; margin: 6px 0; }
    .product-info > p { font-size: 11px; color: #94a3b8; line-height: 1.7; margin: 0 0 14px; flex: 1; }
    .product-bottom { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; gap: 8px; }
    .product-bottom strong { font-size: 17px; display: block; }
    .product-bottom small { font-size: 10px; color: #94a3b8; }
    .add-button {
      background: rgba(16, 185, 129, 0.16); border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7; border-radius: 10px; padding: 9px 12px; font-size: 11px; font-weight: 700;
    }
    .contact-panel {
      display: grid; grid-template-columns: 1fr 1fr; border: 1px solid #1e293b; border-radius: 24px; overflow: hidden; background: #0b1222;
    }
    .contact-copy { padding: 28px; display: grid; gap: 14px; align-content: start; }
    .contact-side { padding: 28px; background: linear-gradient(145deg, #064e3b, #052e2b); display: grid; gap: 12px; }
    .contact-side input, .contact-side textarea {
      width: 100%; border: 1px solid rgba(167, 243, 208, 0.25); border-radius: 11px;
      background: rgba(2, 6, 23, 0.55); color: #f8fafc; padding: 10px 12px; font-size: 12px;
    }
    .footer { border-top: 1px solid var(--line); padding: 20px 0; color: #64748b; font-size: 11px; }
    .toast {
      position: fixed; bottom: 20px; left: 20px; z-index: 100; max-width: 420px;
      background: #0f172a; border: 1px solid #1e293b; border-radius: 14px; padding: 12px 14px;
      display: flex; align-items: center; gap: 10px; font-size: 12px;
    }
    @media (max-width: 820px) {
      .hero-grid, .contact-panel, .product-grid { grid-template-columns: 1fr; }
      .steps-grid { grid-template-columns: repeat(2, 1fr); }
      .hero-stats { grid-template-columns: repeat(2, 1fr); }
      .nav-links { display: none; }
      .nav-links.open {
        display: flex; flex-direction: column; position: absolute; top: 76px; left: 0; right: 0;
        background: #050b19; padding: 16px 20px; border-bottom: 1px solid #1e293b;
      }
      .mobile-menu { display: grid; place-items: center; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const SUPABASE_URL = 'https://asspfwcgvnveejobxrm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Eqym1DI9Vyp5zSliHweaRw_1cwRfIN9';
    const INSTAPAY_NUMBER = '01224966506';
    const WALLET_NUMBER = '01096549960';

    const MERCHANTS = [
      { id: 'hub-1', name: 'فرع زاد لينك الرئيسي', zone: 'جملة وقطاعي', prep: '15-25 د', courier: 'كابتن طارق — دليفري', fee: 20, rating: '4.9' },
      { id: 'fresh-2', name: 'مخزن الطازج والبقالة', zone: 'طازج يومي', prep: '10-20 د', courier: 'كابتن كريم — توصيل', fee: 15, rating: '4.8' },
      { id: 'home-3', name: 'مركز البيت والمنظفات', zone: 'مستلزمات منزلية', prep: '20-30 د', courier: 'كابتن محمود — دليفري', fee: 25, rating: '4.9' },
    ];

    const STAGES = [
      { key: 'received', label: 'تم استلام الطلب', desc: 'وصل للتاجر' },
      { key: 'preparing', label: 'التاجر يجهز الطلب', desc: 'فرز وتغليف' },
      { key: 'on_the_way', label: 'الدليفري في الطريق', desc: 'جاري التوصيل' },
      { key: 'delivered', label: 'تم التسليم', desc: 'اكتمل الطلب' },
    ];

    const PRODUCTS = [
      { id: 1, name: 'أرز أبيض مصري فاخر', category: 'بقالة وسلع أساسية', wholesale: 26, retail: 32, unit: 'كجم', desc: 'أرز مصري نقي للتجار والأسرة.', image: './1000250092.jpg', emoji: '🌾', merchantId: 'hub-1' },
      { id: 2, name: 'زيوت طعام نقية ومعلبات', category: 'زيوت ومعلبات', wholesale: 68, retail: 80, unit: 'عبوة', desc: 'زيوت ومعلبات بتوريد مستمر.', image: './1000250093.jpg', emoji: '🫙', merchantId: 'hub-1' },
      { id: 3, name: 'خضروات وفواكه طازجة', category: 'طعام وطازج', wholesale: 18, retail: 24, unit: 'كجم', desc: 'أصناف طازجة يومياً.', image: './1000250094.jpg', emoji: '🛒', merchantId: 'fresh-2' },
      { id: 4, name: 'منظفات وعناية بالمنزل', category: 'مستلزمات البيت', wholesale: 45, retail: 58, unit: 'عبوة', desc: 'مساحيق ومطهرات ومنظفات.', image: './1000250095.jpg', emoji: '🧴', merchantId: 'home-3' },
      { id: 5, name: 'ألبان وأجبان ومخبوزات', category: 'ألبان ومخبوزات', wholesale: 34, retail: 42, unit: 'عبوة', desc: 'منتجات ألبان ومخبوزات طازجة.', image: './1000250096.jpg', emoji: '🧀', merchantId: 'fresh-2' },
      { id: 6, name: 'مستلزمات ورقية ومطبخ', category: 'مستلزمات البيت', wholesale: 29, retail: 38, unit: 'عبوة', desc: 'مناديل وأدوات مطبخ عملية.', image: './1000250097.jpg', emoji: '🧺', merchantId: 'home-3' },
    ];

    function App() {
      const [customerType, setCustomerType] = useState('retail');
      const [deliveryMode, setDeliveryMode] = useState('delivery');
      const [paymentMethod, setPaymentMethod] = useState('instapay');
      const [selectedMerchantId, setSelectedMerchantId] = useState('hub-1');
      const [selectedCategory, setSelectedCategory] = useState('الكل');
      const [search, setSearch] = useState('');
      const [cart, setCart] = useState([]);
      const [menuOpen, setMenuOpen] = useState(false);
      const [stageIndex, setStageIndex] = useState(0);
      const [customerName, setCustomerName] = useState('');
      const [phone, setPhone] = useState('');
      const [notes, setNotes] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        if (!toast || toast.error) return;
        const t = setTimeout(() => setToast(null), 4000);
        return () => clearTimeout(t);
      }, [toast]);

      const merchant = useMemo(
        () => MERCHANTS.find((m) => m.id === selectedMerchantId) || MERCHANTS[0],
        [selectedMerchantId]
      );

      const categories = useMemo(
        () => ['الكل', ...Array.from(new Set(PRODUCTS.map((p) => p.category)))],
        []
      );

      const getPrice = (p) => (customerType === 'wholesale' ? p.wholesale : p.retail);

      const filtered = useMemo(() => {
        const q = search.trim().toLowerCase();
        return PRODUCTS.filter((p) => {
          const okCat = selectedCategory === 'الكل' || p.category === selectedCategory;
          const okQ = !q || p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
          return okCat && okQ;
        });
      }, [selectedCategory, search]);

      const totalQty = cart.reduce((s, i) => s + i.qty, 0);
      const subtotal = cart.reduce((s, i) => s + getPrice(i.product) * i.qty, 0);
      const fee = deliveryMode === 'pickup' || totalQty === 0 || customerType === 'wholesale' ? 0 : merchant.fee;
      const grandTotal = subtotal + fee;

      function addToCart(product) {
        setCart((prev) => {
          const found = prev.find((i) => i.product.id === product.id);
          if (found) return prev.map((i) => (i.product.id === product.id ? { ...i, qty: i.qty + 1 } : i));
          return [...prev, { product, qty: 1 }];
        });
        setToast({ text: `تمت إضافة "${product.name}" للسلة`, error: false });
      }

      async function handleOrder(e) {
        e.preventDefault();
        setToast(null);
        if (!customerName.trim() || !phone.trim()) {
          setToast({ text: 'يرجى إدخال الاسم ورقم الهاتف', error: true });
          return;
        }

        const itemsText = cart.length
          ? cart.map((i) => `${i.product.name} (${i.qty} × ${getPrice(i.product)} ج.م)`).join(' | ')
          : 'طلب مباشر';

        const payText =
          paymentMethod === 'instapay'
            ? `إنستاباي (${INSTAPAY_NUMBER})`
            : `محفظة (${WALLET_NUMBER})`;

        const fullNotes = [
          `الحساب: ${customerType === 'wholesale' ? 'تاجر جملة' : 'عميل قطاعي'}`,
          `التاجر: ${merchant.name}`,
          `التوصيل: ${deliveryMode === 'delivery' ? merchant.courier : 'استلام من التاجر'}`,
          `الدفع: ${payText}`,
          `الأصناف: ${itemsText}`,
          `الإجمالي: ${grandTotal} ج.م`,
          notes.trim() ? `ملاحظات: ${notes.trim()}` : null,
        ]
          .filter(Boolean)
          .join(' — ');

        setSubmitting(true);
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`,
              Prefer: 'return=minimal',
            },
            body: JSON.stringify({
              customer_name: customerName.trim(),
              phone: phone.trim(),
              notes: fullNotes,
            }),
          });
          if (!res.ok) throw new Error(await res.text());
          setCustomerName('');
          setPhone('');
          setNotes('');
          setCart([]);
          setStageIndex(1);
          setToast({ text: 'تم إرسال طلبك بنجاح وتحديث حالة التجهيز!', error: false });
        } catch (err) {
          setToast({ text: `خطأ: ${err.message || 'تعذر الإرسال'}`, error: true });
        } finally {
          setSubmitting(false);
        }
      }

      return (
        <div className="app-shell">
          <header className="topbar">
            <div className="container nav-wrap">
              <a href="#top" className="brand">
                <span className="brand-mark">ز</span>
                <span>
                  <b>زاد لينك</b>
                  <small>ZADLINK</small>
                </span>
              </a>

              <nav className={`nav-links ${menuOpen ? 'open' : ''}`}>
                <a href="#products" onClick={() => setMenuOpen(false)}>المنتجات</a>
                <a href="#dispatch" onClick={() => setMenuOpen(false)}>التاجر والدليفري</a>
                <a href="#order-box" onClick={() => setMenuOpen(false)}>الدفع والطلب</a>
              </nav>

              <div style={{ display: 'flex', gap: 8 }}>
                <a href="#order-box" className="cart-button">
                  <span>السلة</span>
                  <em>{totalQty}</em>
                </a>
                <button type="button" className="mobile-menu" onClick={() => setMenuOpen((v) => !v)}>
                  {menuOpen ? '✕' : '☰'}
                </button>
              </div>
            </div>
          </header>

          <section id="top" className="hero">
            <div className="container">
              <div className="hero-grid">
                <div className="hero-copy">
                  <span className="eyebrow">طعام • مستلزمات بيت • جملة وقطاعي</span>
                  <h1>منصة <span>زاد لينك</span> للطعام ومستلزمات البيت والسوبر ماركت</h1>
                  <p>بقالة، زيوت، طازج، ومنظفات بربط مباشر بين التاجر والدليفري والعميل مع دفع عبر إنستاباي والمحفظة.</p>
                  <div className="hero-buttons">
                    <a href="#order-box" className="primary-button">سجّل طلبك الآن ←</a>
                    <a href="#products" className="text-button">تصفح المنتجات ↓</a>
                  </div>
                </div>

                <div className="hero-visual">
                  <div className="floating-box">
                    <span>🏪</span>
                    <div>
                      <b>ربط مباشر مع التاجر</b>
                      <small>{merchant.name} — {merchant.prep}</small>
                    </div>
                  </div>
                  <div className="floating-box">
                    <span>🛵</span>
                    <div>
                      <b>توصيل دليفري أو استلام</b>
                      <small>{merchant.courier}</small>
                    </div>
                  </div>
                  <div className="floating-box">
                    <span>💳</span>
                    <div>
                      <b>إنستاباي والمحفظة</b>
                      <small>إنستاباي: {INSTAPAY_NUMBER} • محفظة: {WALLET_NUMBER}</small>
                    </div>
                  </div>
                </div>
              </div>

              <div className="hero-stats">
                <div><strong>+120</strong><span>صنف غذائي ومنزلي</span></div>
                <div><strong>جملة / قطاعي</strong><span>تسعير مرن للتجار والأفراد</span></div>
                <div><strong>دليفري مباشر</strong><span>ربط فوري مع المندوب</span></div>
                <div><strong>24/7</strong><span>استقبال الطلبات يومياً</span></div>
              </div>
            </div>
          </section>

          <section id="dispatch" className="section">
            <div className="container trade-panel">
              <div className="trade-intro">
                <span className="section-kicker">ربط التاجر والموقع والدليفري</span>
                <h2>اختر <span>التاجر ونظام التوصيل</span></h2>
                <p>حدّد الفرع ونوع التوصيل، وتابع مراحل الطلب من الاستلام حتى التسليم.</p>
                <div className="customer-type-switch" style={{ marginTop: 14 }}>
                  <button
                    type="button"
                    className={`type-pill ${deliveryMode === 'delivery' ? 'active' : ''}`}
                    onClick={() => setDeliveryMode('delivery')}
                  >
                    توصيل دليفري
                  </button>
                  <button
                    type="button"
                    className={`type-pill ${deliveryMode === 'pickup' ? 'active' : ''}`}
                    onClick={() => setDeliveryMode('pickup')}
                  >
                    استلام من التاجر
                  </button>
                </div>
              </div>

              <div className="metrics-grid">
                {MERCHANTS.map((m) => (
                  <button
                    key={m.id}
                    type="button"
                    onClick={() => setSelectedMerchantId(m.id)}
                    className={`metric-card ${m.id === merchant.id ? 'active-merchant' : ''}`}
                  >
                    <div className="metric-top">
                      <span>{m.zone}</span>
                      <span>★ {m.rating}</span>
                    </div>
                    <strong>{m.name}</strong>
                    <small>{m.courier} • تجهيز {m.prep}</small>
                  </button>
                ))}
                <div className="metric-card">
                  <div className="metric-top">
                    <span>رسوم التوصيل</span>
                    <span>🛵</span>
                  </div>
                  <strong>{fee === 0 ? 'مجاني / استلام' : `${fee} ج.م`}</strong>
                  <small>{deliveryMode === 'delivery' ? 'توصيل لباب العميل' : 'استلام مباشر من الفرع'}</small>
                </div>
              </div>

              <div className="steps-grid">
                {STAGES.map((st, idx) => (
                  <div
                    key={st.key}
                    className={`metric-card ${idx <= stageIndex ? 'active-merchant' : ''}`}
                  >
                    <div className="metric-top">
                      <span>0{idx + 1}</span>
                      <span>{idx <= stageIndex ? '✓' : '•'}</span>
                    </div>
                    <strong>{st.label}</strong>
                    <small>{st.desc}</small>
                  </div>
                ))}
              </div>
            </div>
          </section>

          <section id="products" className="section">
            <div className="container">
              <div className="section-heading">
                <div>
                  <span className="section-kicker">قائمة الأصناف</span>
                  <h2>المنتجات <span>والأسعار</span></h2>
                </div>

                <div className="customer-type-switch">
                  <button
                    type="button"
                    className={`type-pill ${customerType === 'wholesale' ? 'active' : ''}`}
                    onClick={() => setCustomerType('wholesale')}
                  >
                    تاجر (جملة)
                  </button>
                  <button
                    type="button"
                    className={`type-pill ${customerType === 'retail' ? 'active' : ''}`}
                    onClick={() => setCustomerType('retail')}
                  >
                    عميل قطاعي
                  </button>
                </div>

                <div className="search-box">
                  <span>🔍</span>
                  <input
                    type="search"
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    placeholder="ابحث عن منتج..."
                  />
                </div>
              </div>

              <div className="category-row">
                {categories.map((cat) => (
                  <button
                    key={cat}
                    type="button"
                    onClick={() => setSelectedCategory(cat)}
                    className={`category-chip ${selectedCategory === cat ? 'active' : ''}`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              <div className="product-grid">
                {filtered.map((p) => (
                  <article key={p.id} className="product-card">
                    <div className="product-image">
                      <span className="product-emoji">{p.emoji}</span>
                      <img
                        src={p.image}
                        alt={p.name}
                        loading="lazy"
                        onError={(e) => { e.currentTarget.style.display = 'none'; }}
                      />
                    </div>
                    <div className="product-info">
                      <span className="product-category">{p.category}</span>
                      <h3>{p.name}</h3>
                      <p>{p.desc}</p>
                      <div className="product-bottom">
                        <div>
                          <strong>{getPrice(p)} <small>ج.م / {p.unit}</small></strong>
                          <small>جملة: {p.wholesale} • قطاعي: {p.retail}</small>
                        </div>
                        <button type="button" className="add-button" onClick={() => addToCart(p)}>
                          + أضف للسلة
                        </button>
                      </div>
                    </div>
                  </article>
                ))}
              </div>
            </div>
          </section>

          <section id="order-box" className="section">
            <div className="container contact-panel">
              <div className="contact-copy">
                <span className="section-kicker">طرق الدفع المعتمدة</span>
                <h2>الدفع عبر <span>إنستاباي والمحفظة</span></h2>
                <p>اختر وسيلة الدفع المناسبة وسجّل طلبك مباشرة إلى قاعدة البيانات.</p>
                <div className="floating-box">
                  <span>🏦</span>
                  <div>
                    <b>إنستاباي (InstaPay)</b>
                    <small dir="ltr" style={{ textAlign: 'right' }}>{INSTAPAY_NUMBER}</small>
                  </div>
                </div>
                <div className="floating-box">
                  <span>👛</span>
                  <div>
                    <b>المحفظة الإلكترونية</b>
                    <small dir="ltr" style={{ textAlign: 'right' }}>{WALLET_NUMBER}</small>
                  </div>
                </div>
                <div className="floating-box">
                  <span>🛒</span>
                  <div>
                    <b>ملخص السلة ({totalQty} صنف)</b>
                    <small>الإجمالي النهائي: {grandTotal} ج.م • التاجر: {merchant.name}</small>
                  </div>
                </div>
              </div>

              <form onSubmit={handleOrder} className="contact-side">
                <h3>إرسال طلب جديد</h3>

                <div className="customer-type-switch">
                  <button
                    type="button"
                    className={`type-pill ${paymentMethod === 'instapay' ? 'active' : ''}`}
                    onClick={() => setPaymentMethod('instapay')}
                  >
                    إنستاباي ({INSTAPAY_NUMBER})
                  </button>
                  <button
                    type="button"
                    className={`type-pill ${paymentMethod === 'wallet' ? 'active' : ''}`}
                    onClick={() => setPaymentMethod('wallet')}
                  >
                    المحفظة ({WALLET_NUMBER})
                  </button>
                </div>

                <input
                  type="text"
                  value={customerName}
                  onChange={(e) => setCustomerName(e.target.value)}
                  placeholder="اسم العميل *"
                  required
                />
                <input
                  type="tel"
                  value={phone}
                  onChange={(e) => setPhone(e.target.value)}
                  placeholder="رقم الهاتف *"
                  required
                />
                <textarea
                  rows={3}
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  placeholder="ملاحظات الطلب أو الأصناف المطلوبة"
                />
                <button type="submit" disabled={submitting} className="primary-button">
                  {submitting ? 'جاري الإرسال...' : 'تأكيد وإرسال الطلب'}
                </button>
              </form>
            </div>
          </section>

          <footer className="footer">
            <div className="container" style={{ display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12 }}>
              <span>© {new Date().getFullYear()} زاد لينك (ZadLink)</span>
              <a href="#top">للأعلى ↑</a>
            </div>
          </footer>

          {toast && (
            <div className="toast">
              <span>{toast.error ? '⚠️' : '✓'}</span>
              <span>{toast.text}</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
