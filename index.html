<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>زاد لينك (ZadLink) — تسجيل الدليفري والتاجر والعميل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #020617;
      --panel: #0b1222;
      --card: #0f172a;
      --line: rgba(148, 163, 184, 0.16);
      --text: #f8fafc;
      --muted: #94a3b8;
      --emerald: #10b981;
      --emerald-bright: #34d399;
      --emerald-soft: #6ee7b7;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 84px; background: var(--bg); }
    body { margin: 0; font-family: 'Alexandria', Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font-family: inherit; }
    button { cursor: pointer; }

    .app-shell {
      min-height: 100vh;
      background: radial-gradient(ellipse at 15% 0%, rgba(16, 185, 129, 0.16), transparent 42%), var(--bg);
      overflow-x: clip;
    }

    .container { width: min(1160px, calc(100% - 32px)); margin-inline: auto; }

    .topbar {
      position: sticky; top: 0; z-index: 40; height: 74px;
      background: rgba(2, 6, 23, 0.92); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line);
    }

    .nav-wrap { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center;
      background: linear-gradient(145deg, var(--emerald-soft), var(--emerald)); color: #022c22; font-weight: 800; font-size: 18px;
    }
    .brand b { display: block; font-size: 17px; font-weight: 800; }
    .brand small { display: block; font-size: 9px; letter-spacing: 2.5px; color: var(--emerald-soft); font-weight: 700; }

    .nav-links { display: flex; align-items: center; gap: 18px; font-size: 12px; color: #cbd5e1; }
    .nav-links a:hover { color: var(--emerald-soft); }

    .pill-badge {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 13px; border-radius: 12px;
      border: 1px solid rgba(16, 185, 129, 0.35); background: rgba(16, 185, 129, 0.14); color: #d1fae5; font-size: 11.5px; font-weight: 700;
    }

    .section { padding: 36px 0; }
    .panel {
      border: 1px solid rgba(16, 185, 129, 0.22); border-radius: 24px; padding: 24px;
      background: linear-gradient(145deg, var(--card), #080e1b); display: grid; gap: 20px;
    }

    .kicker {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 13px; border-radius: 999px;
      border: 1px solid rgba(16, 185, 129, 0.28); background: rgba(16, 185, 129, 0.1); color: var(--emerald-soft); font-size: 11px; font-weight: 600;
    }

    h1, h2, h3 { margin: 0; }
    h1 { font-size: clamp(24px, 3.8vw, 40px); line-height: 1.35; font-weight: 800; margin-top: 10px; }
    h1 span, h2 span { color: var(--emerald-bright); }

    .switch-group {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 6px;
      border-radius: 14px; background: #060c18; border: 1px solid #1e293b;
    }

    .switch-btn {
      border: 1px solid transparent; background: transparent; color: var(--muted);
      padding: 12px 14px; border-radius: 10px; font-size: 12px; font-weight: 700; text-align: center;
    }

    .switch-btn.active {
      background: linear-gradient(135deg, #10b981, #059669); color: #022c22; font-weight: 800;
    }

    .reg-grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 20px; align-items: start; }

    .form-card, .features-card {
      border: 1px solid var(--line); border-radius: 20px; padding: 20px; background: rgba(2, 6, 23, 0.65); display: grid; gap: 14px;
    }

    .field { display: grid; gap: 6px; font-size: 12px; color: #e2e8f0; }
    .field input, .field select, .field textarea {
      width: 100%; border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 11px;
      background: #060c18; color: var(--text); padding: 10px 12px; font-size: 12px;
    }

    .btn-primary {
      border: 0; border-radius: 12px; padding: 12px 18px; background: linear-gradient(135deg, var(--emerald-bright), #059669);
      color: #022c22; font-size: 12.5px; font-weight: 800;
    }

    .feat-list { display: grid; gap: 10px; }
    .feat-item {
      border: 1px solid rgba(16, 185, 129, 0.22); border-radius: 14px; padding: 12px;
      background: rgba(15, 23, 42, 0.85); display: grid; gap: 4px;
    }
    .feat-item strong { font-size: 12.5px; color: var(--emerald-soft); }
    .feat-item small { font-size: 11px; color: var(--muted); }

    .members-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .member-card {
      border: 1px solid var(--line); border-radius: 16px; padding: 14px;
      background: rgba(15, 23, 42, 0.85); display: grid; gap: 6px; font-size: 11.5px;
    }
    .member-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .role-tag {
      padding: 3px 9px; border-radius: 8px; font-size: 10px; font-weight: 700;
      background: rgba(16, 185, 129, 0.16); color: var(--emerald-soft); border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .toast {
      position: fixed; bottom: 18px; left: 18px; z-index: 60; max-width: 420px; padding: 12px 14px; border-radius: 14px;
      background: var(--card); border: 1px solid #1e293b; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5); font-size: 12px; display: flex; align-items: center; gap: 10px;
    }

    @media (max-width: 820px) {
      .reg-grid, .members-grid, .switch-group { grid-template-columns: 1fr; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = 'https://asspfwcgvnveejobxrm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Eqym1DI9Vyp5zSliHweaRw_1cwRfIN9';

    // تعريف خصائص كل دور في صفحة التسجيل
    const ROLE_CONFIG = {
      customer: {
        title: 'تسجيل حساب عميل (قطاعي / منزل)',
        kicker: 'خصائص حساب العميل',
        features: [
          { title: 'شراء بالقطاعي وتوصيل مباشر', desc: 'طلب الأغذية والطازج ومستلزمات البيت وتوصيلها للباب أو الاستلام من الفرع.' },
          { title: 'تتبع لحظي لحالة الطلب', desc: 'متابعة مراحل تجهيز التاجر وخروج الدليفري حتى التسليم.' },
          { title: 'خيارات دفع مرنة', desc: 'الدفع عند الاستلام أو عبر إنستاباي والمحفظة الإلكترونية.' },
        ],
      },
      merchant: {
        title: 'تسجيل حساب تاجر / فرع توريد',
        kicker: 'خصائص حساب التاجر',
        features: [
          { title: 'توريد الجملة والقطاعي وإدارة المخزون', desc: 'استقبال طلبات الجملة والقطاعي وتحديد زمن التجهيز لكل صنف.' },
          { title: 'ربط مباشر مع مندوبي الدليفري', desc: 'إسناد الطلبات الجاهزة للدليفري أو تجهيزها للاستلام المباشر.' },
          { title: 'حساب تلقائي لصافي أرباح التاجر', desc: 'احتساب مستحقات التاجر تلقائياً بعد خصم نسبة المنصة ورسوم التوصيل.' },
        ],
      },
      courier: {
        title: 'تسجيل حساب مندوب دليفري',
        kicker: 'خصائص حساب الدليفري',
        features: [
          { title: 'تحديد وسيلة النقل ونطاق التغطية', desc: 'تسجيل الموتوسيكل أو السيارة ومنطقة التغطية ومواعيد العمل.' },
          { title: 'تحديث حالة التوصيل والتسليم', desc: 'تحديث حالة الطلب إلى (في الطريق) ثم (تم التسليم) بضغطة واحدة.' },
          { title: 'حساب تلقائي لأرباح الدليفري', desc: 'احتساب رسوم التوصيل المستحقة للمندوب عن كل طلب مكتمل.' },
        ],
      },
    };

    const INITIAL_MEMBERS = [
      {
        id: 'm-1',
        role: 'customer',
        roleLabel: 'عميل',
        name: 'سارة حسن',
        phone: '01055443322',
        meta: 'العنوان: بورسعيد — حي الشرق • دفع مفضل: إنستاباي',
      },
      {
        id: 'm-2',
        role: 'merchant',
        roleLabel: 'تاجر',
        name: 'مخزن النور للبقالة والجملة',
        phone: '01277665544',
        meta: 'النشاط: بقالة وزيوت • تجهيز: 15-25 د • جملة وقطاعي',
      },
      {
        id: 'm-3',
        role: 'courier',
        roleLabel: 'دليفري',
        name: 'كابتن طارق سمير',
        phone: '01144332211',
        meta: 'المركبة: موتوسيكل • النطاق: جميع المناطق • متاح للتوصيل',
      },
    ];

    function App() {
      const [role, setRole] = useState('customer');
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');

      // خصائص العميل
      const [address, setAddress] = useState('');
      const [preferredPayment, setPreferredPayment] = useState('الدفع عند الاستلام');

      // خصائص التاجر
      const [storeName, setStoreName] = useState('');
      const [specialty, setSpecialty] = useState('بقالة وسلع أساسية');
      const [supplyMode, setSupplyMode] = useState('جملة وقطاعي');

      // خصائص الدليفري
      const [vehicle, setVehicle] = useState('موتوسيكل');
      const [coverageZone, setCoverageZone] = useState('');
      const [shiftStatus, setShiftStatus] = useState('متاح فوراً للتوصيل');

      const [members, setMembers] = useState(INITIAL_MEMBERS);
      const [saving, setSaving] = useState(false);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        if (!toast || toast.error) return;
        const timer = setTimeout(() => setToast(null), 4000);
        return () => clearTimeout(timer);
      }, [toast]);

      const currentConfig = ROLE_CONFIG[role];

      async function handleRegister(e) {
        e.preventDefault();
        setToast(null);

        if (!name.trim() || !phone.trim()) {
          setToast({ text: 'يرجى إدخال الاسم ورقم الهاتف أولاً.', error: true });
          return;
        }

        const roleLabel =
          role === 'customer' ? 'عميل' : role === 'merchant' ? 'تاجر' : 'دليفري';

        const metaText =
          role === 'customer'
            ? `العنوان: ${address.trim() || 'غير محدد'} • الدفع: ${preferredPayment}`
            : role === 'merchant'
              ? `النشاط: ${storeName.trim() || name.trim()} (${specialty}) • النظام: ${supplyMode}`
              : `المركبة: ${vehicle} • النطاق: ${coverageZone.trim() || 'عام'} • الحالة: ${shiftStatus}`;

        const newMember = {
          id: `mem-${Date.now()}`,
          role,
          roleLabel,
          name: name.trim(),
          phone: phone.trim(),
          meta: metaText,
        };

        setSaving(true);
        try {
          await fetch(`${SUPABASE_URL}/rest/v1/notifications`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`,
              Prefer: 'return=minimal',
            },
            body: JSON.stringify({
              target_role: role,
              title: `تسجيل ${roleLabel} جديد`,
              message: `${name.trim()} (${phone.trim()}) — ${metaText}`,
            }),
          }).catch(() => {});

          setMembers((prev) => [newMember, ...prev]);
          setName('');
          setPhone('');
          setAddress('');
          setStoreName('');
          setCoverageZone('');
          setToast({ text: `تم تسجيل حساب ${roleLabel} (${newMember.name}) بنجاح!`, error: false });
        } finally {
          setSaving(false);
        }
      }

      return (
        <div id="top" className="app-shell">
          <header className="topbar">
            <div className="container nav-wrap">
              <a href="#top" className="brand">
                <span className="brand-mark">ز</span>
                <span>
                  <b>زاد لينك</b>
                  <small>ZADLINK</small>
                </span>
              </a>

              <nav className="nav-links">
                <a href="#register-section">صفحة التسجيل</a>
                <a href="#members-section">المسجلون ({members.length})</a>
              </nav>

              <span className="pill-badge">تسجيل الأدوار • عميل / تاجر / دليفري</span>
            </div>
          </header>

          <section id="register-section" className="section">
            <div className="container panel">
              <div>
                <span className="kicker">تسجيل حساب جديد حسب الدور</span>
                <h1>
                  صفحة تسجيل <span>الدليفري والتاجر والعميل</span> كل واحد بخصائصه
                </h1>
              </div>

              <div className="switch-group" role="tablist" aria-label="اختيار نوع الحساب">
                <button
                  type="button"
                  className={`switch-btn ${role === 'customer' ? 'active' : ''}`}
                  onClick={() => setRole('customer')}
                >
                  🛒 تسجيل عميل
                </button>
                <button
                  type="button"
                  className={`switch-btn ${role === 'merchant' ? 'active' : ''}`}
                  onClick={() => setRole('merchant')}
                >
                  🏪 تسجيل تاجر
                </button>
                <button
                  type="button"
                  className={`switch-btn ${role === 'courier' ? 'active' : ''}`}
                  onClick={() => setRole('courier')}
                >
                  🛵 تسجيل دليفري
                </button>
              </div>

              <div className="reg-grid">
                <form onSubmit={handleRegister} className="form-card">
                  <h3>{currentConfig.title}</h3>

                  <label className="field">
                    <span>الاسم الكامل *</span>
                    <input
                      type="text"
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                      placeholder="اكتب الاسم الكامل"
                      required
                    />
                  </label>

                  <label className="field">
                    <span>رقم الهاتف *</span>
                    <input
                      type="tel"
                      value={phone}
                      onChange={(e) => setPhone(e.target.value)}
                      placeholder="01xxxxxxxxx"
                      required
                    />
                  </label>

                  {role === 'customer' && (
                    <>
                      <label className="field">
                        <span>عنوان التوصيل</span>
                        <input
                          type="text"
                          value={address}
                          onChange={(e) => setAddress(e.target.value)}
                          placeholder="المدينة، الحي، الشارع، رقم العقار"
                        />
                      </label>
                      <label className="field">
                        <span>وسيلة الدفع المفضلة</span>
                        <select
                          value={preferredPayment}
                          onChange={(e) => setPreferredPayment(e.target.value)}
                        >
                          <option value="الدفع عند الاستلام">الدفع عند الاستلام</option>
                          <option value="إنستاباي (01224966506)">إنستاباي (01224966506)</option>
                          <option value="المحفظة الإلكترونية (01096549960)">المحفظة الإلكترونية (01096549960)</option>
                        </select>
                      </label>
                    </>
                  )}

                  {role === 'merchant' && (
                    <>
                      <label className="field">
                        <span>اسم المتجر أو المخزن</span>
                        <input
                          type="text"
                          value={storeName}
                          onChange={(e) => setStoreName(e.target.value)}
                          placeholder="مثال: فرع زاد لينك / مخزن الأغذية"
                        />
                      </label>
                      <label className="field">
                        <span>التخصص الرئيسي</span>
                        <select
                          value={specialty}
                          onChange={(e) => setSpecialty(e.target.value)}
                        >
                          <option value="بقالة وسلع أساسية">بقالة وسلع أساسية</option>
                          <option value="طعام وطازج وألبان">طعام وطازج وألبان</option>
                          <option value="مستلزمات البيت والمنظفات">مستلزمات البيت والمنظفات</option>
                        </select>
                      </label>
                      <label className="field">
                        <span>نظام التوريد</span>
                        <select
                          value={supplyMode}
                          onChange={(e) => setSupplyMode(e.target.value)}
                        >
                          <option value="جملة وقطاعي">جملة وقطاعي</option>
                          <option value="جملة فقط">جملة فقط</option>
                          <option value="قطاعي فقط">قطاعي فقط</option>
                        </select>
                      </label>
                    </>
                  )}

                  {role === 'courier' && (
                    <>
                      <label className="field">
                        <span>وسيلة التوصيل</span>
                        <select
                          value={vehicle}
                          onChange={(e) => setVehicle(e.target.value)}
                        >
                          <option value="موتوسيكل">موتوسيكل</option>
                          <option value="سيارة توصيل">سيارة توصيل</option>
                          <option value="دراجة كهربائية">دراجة كهربائية</option>
                        </select>
                      </label>
                      <label className="field">
                        <span>منطقة التغطية</span>
                        <input
                          type="text"
                          value={coverageZone}
                          onChange={(e) => setCoverageZone(e.target.value)}
                          placeholder="مثال: بورسعيد / المناطق المجاورة"
                        />
                      </label>
                      <label className="field">
                        <span>حالة التواجد</span>
                        <select
                          value={shiftStatus}
                          onChange={(e) => setShiftStatus(e.target.value)}
                        >
                          <option value="متاح فوراً للتوصيل">متاح فوراً للتوصيل</option>
                          <option value="فترة صباحية">فترة صباحية</option>
                          <option value="فترة مسائية">فترة مسائية</option>
                        </select>
                      </label>
                    </>
                  )}

                  <button type="submit" disabled={saving} className="btn-primary">
                    {saving ? 'جاري التسجيل...' : 'إتمام التسجيل'}
                  </button>
                </form>

                <div className="features-card">
                  <span className="kicker">{currentConfig.kicker}</span>
                  <div className="feat-list">
                    {currentConfig.features.map((f) => (
                      <div key={f.title} className="feat-item">
                        <strong>{f.title}</strong>
                        <small>{f.desc}</small>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section id="members-section" className="section" style={{ paddingTop: 0 }}>
            <div className="container panel">
              <h2>
                الحسابات <span>المسجلة</span> ({members.length})
              </h2>

              <div className="members-grid">
                {members.map((m) => (
                  <div key={m.id} className="member-card">
                    <div className="member-top">
                      <strong>{m.name}</strong>
                      <span className="role-tag">{m.roleLabel}</span>
                    </div>
                    <span style={{ color: '#cbd5e1' }}>الهاتف: {m.phone}</span>
                    <small style={{ color: '#94a3b8' }}>{m.meta}</small>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {toast && (
            <div className="toast">
              <span>{toast.error ? '⚠️' : '✓'}</span>
              <span>{toast.text}</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
