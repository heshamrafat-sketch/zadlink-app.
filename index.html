<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>زاد لينك (ZadLink) — الطعام ومستلزمات البيت والسوبر ماركت</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #020617;
      --panel: #0b1222;
      --card: #0f172a;
      --line: rgba(148, 163, 184, 0.16);
      --text: #f8fafc;
      --muted: #94a3b8;
      --emerald: #10b981;
      --emerald-bright: #34d399;
      --emerald-soft: #6ee7b7;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 84px; background: var(--bg); }
    body { margin: 0; font-family: 'Alexandria', Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
    a { color: inherit; text-decoration: none; }
    button, input, textarea { font-family: inherit; }
    button { cursor: pointer; }

    .app-shell {
      min-height: 100vh;
      background: radial-gradient(ellipse at 15% 0%, rgba(16, 185, 129, 0.16), transparent 42%), var(--bg);
      overflow-x: clip;
    }

    .container { width: min(1160px, calc(100% - 32px)); margin-inline: auto; }

    .topbar {
      position: sticky; top: 0; z-index: 40; height: 74px;
      background: rgba(2, 6, 23, 0.92); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line);
    }

    .nav-wrap { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center;
      background: linear-gradient(145deg, var(--emerald-soft), var(--emerald)); color: #022c22; font-weight: 800; font-size: 18px;
    }
    .brand b { display: block; font-size: 17px; font-weight: 800; }
    .brand small { display: block; font-size: 9px; letter-spacing: 2.5px; color: var(--emerald-soft); font-weight: 700; }

    .nav-links { display: flex; align-items: center; gap: 20px; font-size: 12px; color: #cbd5e1; }
    .nav-links a:hover { color: var(--emerald-soft); }

    .cart-pill {
      display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 12px;
      border: 1px solid rgba(16, 185, 129, 0.35); background: rgba(16, 185, 129, 0.14); color: #d1fae5; font-size: 12px; font-weight: 700;
    }
    .cart-pill em {
      font-style: normal; min-width: 22px; height: 22px; border-radius: 8px; display: grid; place-items: center;
      background: var(--emerald); color: #022c22; font-size: 11px; font-weight: 800;
    }

    .hero { padding: 48px 0 24px; }
    .hero-grid { display: grid; grid-template-columns: 1.08fr 0.92fr; gap: 28px; align-items: center; }
    .kicker {
      display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px;
      border: 1px solid rgba(16, 185, 129, 0.28); background: rgba(16, 185, 129, 0.1); color: var(--emerald-soft); font-size: 11px; font-weight: 600;
    }
    h1 { margin: 16px 0 12px; font-size: clamp(28px, 4.2vw, 48px); line-height: 1.32; font-weight: 800; }
    h1 span, h2 span { color: var(--emerald-bright); }
    .hero p { margin: 0; color: var(--muted); font-size: 13px; line-height: 2; }
    .hero-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 22px; }
    .btn-primary {
      border: 0; border-radius: 13px; padding: 12px 20px; background: linear-gradient(135deg, var(--emerald-bright), #059669);
      color: #022c22; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-secondary {
      border: 1px solid var(--line); border-radius: 13px; padding: 11px 16px; background: var(--card); color: #e2e8f0; font-size: 12px; font-weight: 600;
    }

    .hero-cards {
      display: grid; gap: 12px; padding: 20px; border-radius: 22px; border: 1px solid rgba(16, 185, 129, 0.22);
      background: radial-gradient(circle at 50% 20%, rgba(16, 185, 129, 0.18), transparent 65%), var(--panel);
    }
    .info-card {
      display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 15px;
      background: rgba(15, 23, 42, 0.92); border: 1px solid var(--line);
    }
    .info-card > span { font-size: 22px; }
    .info-card b { display: block; font-size: 13px; }
    .info-card small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }

    .stats-bar {
      margin-top: 32px; padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
    }
    .stats-bar strong { display: block; font-size: 20px; color: var(--emerald-bright); }
    .stats-bar span { font-size: 11px; color: var(--muted); }

    .section { padding: 56px 0; }
    .panel {
      border: 1px solid rgba(16, 185, 129, 0.22); border-radius: 24px; padding: 24px;
      background: linear-gradient(145deg, var(--card), #080e1b); display: grid; gap: 20px;
    }
    .panel-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
    .panel-head h2 { margin: 8px 0 0; font-size: clamp(22px, 3vw, 32px); }

    .switch-group {
      display: inline-flex; gap: 4px; padding: 4px; border-radius: 12px; background: #060c18; border: 1px solid #1e293b; flex-wrap: wrap;
    }
    .switch-btn { border: 0; background: transparent; color: var(--muted); padding: 8px 14px; border-radius: 9px; font-size: 11px; font-weight: 700; }
    .switch-btn.active { background: #059669; color: #ffffff; }

    .merchants-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .merchant-card {
      border: 1px solid var(--line); background: rgba(2, 6, 23, 0.65); border-radius: 16px; padding: 15px; color: var(--text); text-align: right;
    }
    .merchant-card.selected { border-color: var(--emerald-bright); background: rgba(6, 78, 59, 0.28); }
    .merchant-top { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); }
    .merchant-card strong { display: block; margin: 8px 0 4px; font-size: 14px; }
    .merchant-card small { display: block; font-size: 10.5px; color: #cbd5e1; }

    .stages-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .stage-card {
      border: 1px solid var(--line); border-radius: 14px; padding: 13px; background: rgba(2, 6, 23, 0.5); opacity: 0.65;
    }
    .stage-card.done { opacity: 1; border-color: rgba(52, 211, 153, 0.45); background: rgba(6, 78, 59, 0.2); }
    .stage-card strong { display: block; font-size: 12.5px; margin: 6px 0 2px; }
    .stage-card small { font-size: 10.5px; color: var(--muted); }

    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .search-box {
      display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid #1e293b; background: var(--card); min-width: 220px;
    }
    .search-box input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 12px; }

    .chips-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 14px; }
    .chip { white-space: nowrap; border: 1px solid #1e293b; background: var(--panel); color: var(--muted); border-radius: 10px; padding: 8px 14px; font-size: 11px; }
    .chip.active { background: #064e3b; border-color: #059669; color: #a7f3d0; }

    .products-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .product-card {
      border: 1px solid #1e293b; border-radius: 20px; overflow: hidden; background: linear-gradient(150deg, rgba(15, 23, 42, 0.96), rgba(7, 14, 27, 0.98)); display: flex; flex-direction: column;
    }
    .product-media { height: 170px; position: relative; display: grid; place-items: center; background: var(--panel); overflow: hidden; }
    .product-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }
    .product-media span { font-size: 54px; z-index: 1; }

    .product-body { padding: 15px; display: flex; flex-direction: column; flex: 1; }
    .product-body .cat { font-size: 10.5px; color: var(--emerald-bright); font-weight: 600; }
    .product-body h3 { margin: 5px 0; font-size: 15px; }
    .product-body p { margin: 0 0 14px; font-size: 11px; color: var(--muted); flex: 1; }
    .product-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
    .product-foot strong { display: block; font-size: 17px; }
    .product-foot small { font-size: 10px; color: var(--muted); }
    .add-btn { border: 1px solid rgba(16, 185, 129, 0.35); background: rgba(16, 185, 129, 0.16); color: var(--emerald-soft); border-radius: 10px; padding: 9px 12px; font-size: 11px; font-weight: 700; }

    .order-grid { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid #1e293b; border-radius: 24px; overflow: hidden; background: var(--panel); }
    .payment-col { padding: 26px; display: grid; gap: 12px; align-content: start; }
    .form-col { padding: 26px; background: linear-gradient(145deg, #064e3b, #052e2b); display: grid; gap: 12px; align-content: start; }
    .form-col h3 { margin: 0; font-size: 20px; }
    .form-col input, .form-col textarea {
      width: 100%; border: 1px solid rgba(167, 243, 208, 0.25); border-radius: 11px; background: rgba(2, 6, 23, 0.6); color: var(--text); padding: 10px 12px; font-size: 12px;
    }

    .cart-preview { border-radius: 14px; background: rgba(2, 6, 23, 0.5); border: 1px solid rgba(167, 243, 208, 0.2); padding: 12px; font-size: 11.5px; display: grid; gap: 6px; }
    .cart-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .qty-controls { display: inline-flex; align-items: center; gap: 6px; }
    .qty-controls button { width: 24px; height: 24px; border-radius: 7px; border: 1px solid rgba(167, 243, 208, 0.3); background: rgba(16, 185, 129, 0.2); color: #fff; font-weight: 700; }

    .toast {
      position: fixed; bottom: 18px; left: 18px; z-index: 60; max-width: 420px; padding: 12px 14px; border-radius: 14px;
      background: var(--card); border: 1px solid #1e293b; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5); font-size: 12px; display: flex; align-items: center; gap: 10px;
    }

    footer { border-top: 1px solid var(--line); padding: 20px 0; color: var(--muted); font-size: 11px; }

    @media (max-width: 820px) {
      .hero-grid, .merchants-grid, .products-grid, .order-grid { grid-template-columns: 1fr; }
      .stages-grid, .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const SUPABASE_URL = 'https://asspfwcgvnveejobxrm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Eqym1DI9Vyp5zSliHweaRw_1cwRfIN9';
    const INSTAPAY_NUMBER = '01224966506';
    const WALLET_NUMBER = '01096549960';

    const MERCHANTS = [
      { id: 'hub-1', name: 'فرع زاد لينك الرئيسي', zone: 'جملة وقطاعي', prep: '15-25 د', courier: 'كابتن طارق — دليفري', fee: 20, rating: '4.9' },
      { id: 'fresh-2', name: 'مخزن الطازج والبقالة', zone: 'طازج يومي', prep: '10-20 د', courier: 'كابتن كريم — توصيل', fee: 15, rating: '4.8' },
      { id: 'home-3', name: 'مركز البيت والمنظفات', zone: 'مستلزمات منزلية', prep: '20-30 د', courier: 'كابتن محمود — دليفري', fee: 25, rating: '4.9' },
    ];

    const STAGES = [
      { key: 'received', label: 'تم استلام الطلب', desc: 'وصل للتاجر' },
      { key: 'preparing', label: 'التاجر يجهز الطلب', desc: 'فرز وتغليف' },
      { key: 'on_the_way', label: 'الدليفري في الطريق', desc: 'جاري التوصيل' },
      { key: 'delivered', label: 'تم التسليم', desc: 'اكتمل الطلب' },
    ];

    const PRODUCTS = [
      { id: 1, name: 'أرز أبيض مصري فاخر', category: 'بقالة وسلع أساسية', wholesale: 26, retail: 32, unit: 'كجم', desc: 'أرز مصري نقي للتجار والأسرة.', image: './1000250092.jpg', emoji: '🌾' },
      { id: 2, name: 'زيوت طعام نقية ومعلبات', category: 'زيوت ومعلبات', wholesale: 68, retail: 80, unit: 'عبوة', desc: 'زيوت ومعلبات بتوريد مستمر.', image: './1000250093.jpg', emoji: '🫙' },
      { id: 3, name: 'خضروات وفواكه طازجة', category: 'طعام وطازج', wholesale: 18, retail: 24, unit: 'كجم', desc: 'أصناف طازجة يومياً.', image: './1000250094.jpg', emoji: '🛒' },
      { id: 4, name: 'منظفات وعناية بالمنزل', category: 'مستلزمات البيت', wholesale: 45, retail: 58, unit: 'عبوة', desc: 'مساحيق ومطهرات ومنظفات.', image: './1000250095.jpg', emoji: '🧴' },
      { id: 5, name: 'ألبان وأجبان ومخبوزات', category: 'ألبان ومخبوزات', wholesale: 34, retail: 42, unit: 'عبوة', desc: 'منتجات ألبان ومخبوزات طازجة.', image: './1000250096.jpg', emoji: '🧀' },
      { id: 6, name: 'مستلزمات ورقية ومطبخ', category: 'مستلزمات البيت', wholesale: 29, retail: 38, unit: 'عبوة', desc: 'مناديل وأدوات مطبخ عملية.', image: './1000250097.jpg', emoji: '🧺' },
    ];

    function App() {
      const [customerType, setCustomerType] = useState('retail');
      const [deliveryMode, setDeliveryMode] = useState('delivery');
      const [paymentMethod, setPaymentMethod] = useState('instapay');
      const [merchantId, setMerchantId] = useState('hub-1');
      const [category, setCategory] = useState('الكل');
      const [query, setQuery] = useState('');
      const [cart, setCart] = useState([]);
      const [stageIndex, setStageIndex] = useState(0);
      const [customerName, setCustomerName] = useState('');
      const [phone, setPhone] = useState('');
      const [notes, setNotes] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        if (!toast || toast.error) return;
        const timer = setTimeout(() => setToast(null), 4000);
        return () => clearTimeout(timer);
      }, [toast]);

      const merchant = useMemo(
        () => MERCHANTS.find((m) => m.id === merchantId) || MERCHANTS[0],
        [merchantId]
      );

      const categories = useMemo(
        () => ['الكل', ...Array.from(new Set(PRODUCTS.map((p) => p.category)))],
        []
      );

      const getPrice = (p) => (customerType === 'wholesale' ? p.wholesale : p.retail);

      const filteredProducts = useMemo(() => {
        const q = query.trim().toLowerCase();
        return PRODUCTS.filter((p) => {
          const matchCat = category === 'الكل' || p.category === category;
          const matchQ = !q || p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
          return matchCat && matchQ;
        });
      }, [category, query]);

      const totalCount = cart.reduce((acc, item) => acc + item.qty, 0);
      const subtotal = cart.reduce((acc, item) => acc + getPrice(item.product) * item.qty, 0);
      const deliveryFee =
        deliveryMode === 'pickup' || totalCount === 0 || customerType === 'wholesale'
          ? 0
          : merchant.fee;
      const grandTotal = subtotal + deliveryFee;

      function addItem(product) {
        setCart((prev) => {
          const existing = prev.find((i) => i.product.id === product.id);
          if (existing) {
            return prev.map((i) =>
              i.product.id === product.id ? { ...i, qty: i.qty + 1 } : i
            );
          }
          return [...prev, { product, qty: 1 }];
        });
        setToast({ text: `تمت إضافة "${product.name}" للسلة`, error: false });
      }

      function updateQty(id, delta) {
        setCart((prev) =>
          prev
            .map((i) => (i.product.id === id ? { ...i, qty: i.qty + delta } : i))
            .filter((i) => i.qty > 0)
        );
      }

      async function submitOrder(e) {
        e.preventDefault();
        setToast(null);

        if (!customerName.trim() || !phone.trim()) {
          setToast({ text: 'يرجى إدخال اسم العميل ورقم الهاتف أولاً.', error: true });
          return;
        }

        const itemsText = cart.length
          ? cart
              .map((i) => `${i.product.name} (${i.qty} ${i.product.unit} × ${getPrice(i.product)} ج.م)`)
              .join(' | ')
          : 'طلب مباشر';

        const paymentText =
          paymentMethod === 'instapay'
            ? `إنستاباي (${INSTAPAY_NUMBER})`
            : `محفظة (${WALLET_NUMBER})`;

        const deliveryText =
          deliveryMode === 'delivery'
            ? `دليفري (${merchant.courier}) — ${deliveryFee} ج.م`
            : 'استلام من التاجر';

        const fullNotes = [
          `الحساب: ${customerType === 'wholesale' ? 'تاجر جملة' : 'عميل قطاعي'}`,
          `التاجر: ${merchant.name}`,
          `التوصيل: ${deliveryText}`,
          `الدفع: ${paymentText}`,
          `الأصناف: ${itemsText}`,
          `الإجمالي: ${grandTotal} ج.م`,
          notes.trim() ? `ملاحظات: ${notes.trim()}` : null,
        ]
          .filter(Boolean)
          .join(' — ');

        setSubmitting(true);
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`,
              Prefer: 'return=minimal',
            },
            body: JSON.stringify({
              customer_name: customerName.trim(),
              phone: phone.trim(),
              notes: fullNotes,
            }),
          });

          if (!res.ok) {
            throw new Error(await res.text());
          }

          setCustomerName('');
          setPhone('');
          setNotes('');
          setCart([]);
          setStageIndex(1);
          setToast({ text: 'تم إرسال طلبك بنجاح وتحديث حالة التجهيز!', error: false });
        } catch (err) {
          setToast({ text: `خطأ: ${err.message || 'تعذر إرسال الطلب'}`, error: true });
        } finally {
          setSubmitting(false);
        }
      }

      return (
        <div id="top" className="app-shell">
          <header className="topbar">
            <div className="container nav-wrap">
              <a href="#top" className="brand">
                <span className="brand-mark">ز</span>
                <span>
                  <b>زاد لينك</b>
                  <small>ZADLINK</small>
                </span>
              </a>

              <nav className="nav-links">
                <a href="#dispatch">التاجر والدليفري</a>
                <a href="#products">المنتجات والأسعار</a>
                <a href="#order">الدفع والطلب</a>
              </nav>

              <a href="#order" className="cart-pill">
                <span>سلة الطلبات</span>
                <em>{totalCount}</em>
              </a>
            </div>
          </header>

          <section className="hero">
            <div className="container">
              <div className="hero-grid">
                <div>
                  <span className="kicker">طعام • مستلزمات بيت • سوبر ماركت • جملة وقطاعي</span>
                  <h1>
                    منصة <span>زاد لينك</span> للطعام ومستلزمات البيت والسوبر ماركت
                  </h1>
                  <p>
                    كل احتياجات الطعام ومستلزمات البيت للتاجر والقطاعي في مكان واحد؛ بقالة، زيوت، طازج، ومنظفات بربط مباشر مع التاجر والدليفري.
                  </p>
                  <div className="hero-actions">
                    <a href="#order" className="btn-primary">سجّل طلبك الآن ←</a>
                    <a href="#products" className="btn-secondary">تصفح المنتجات ↓</a>
                  </div>
                </div>

                <div className="hero-cards">
                  <div className="info-card">
                    <span>🏪</span>
                    <div>
                      <b>ربط مباشر مع التاجر</b>
                      <small>{merchant.name} • تجهيز {merchant.prep}</small>
                    </div>
                  </div>
                  <div className="info-card">
                    <span>🛵</span>
                    <div>
                      <b>توصيل دليفري أو استلام</b>
                      <small>{merchant.courier}</small>
                    </div>
                  </div>
                  <div className="info-card">
                    <span>💳</span>
                    <div>
                      <b>إنستاباي والمحفظة</b>
                      <small>إنستاباي: {INSTAPAY_NUMBER} • محفظة: {WALLET_NUMBER}</small>
                    </div>
                  </div>
                </div>
              </div>

              <div className="stats-bar">
                <div><strong>+120</strong><span>صنف غذائي ومنزلي</span></div>
                <div><strong>جملة / قطاعي</strong><span>تسعير مرن للتجار والأسرة</span></div>
                <div><strong>دليفري مباشر</strong><span>ربط فوري مع المندوب</span></div>
                <div><strong>24/7</strong><span>استقبال الطلبات يومياً</span></div>
              </div>
            </div>
          </section>

          <section id="dispatch" className="section">
            <div className="container panel">
              <div className="panel-head" style={{ marginBottom: 0 }}>
                <div>
                  <span className="kicker">ربط التاجر والموقع والدليفري</span>
                  <h2>اختر <span>التاجر ونظام التوصيل</span></h2>
                </div>

                <div className="switch-group">
                  <button
                    type="button"
                    className={`switch-btn ${deliveryMode === 'delivery' ? 'active' : ''}`}
                    onClick={() => setDeliveryMode('delivery')}
                  >
                    توصيل دليفري
                  </button>
                  <button
                    type="button"
                    className={`switch-btn ${deliveryMode === 'pickup' ? 'active' : ''}`}
                    onClick={() => setDeliveryMode('pickup')}
                  >
                    استلام من التاجر
                  </button>
                </div>
              </div>

              <div className="merchants-grid">
                {MERCHANTS.map((m) => (
                  <button
                    key={m.id}
                    type="button"
                    onClick={() => setMerchantId(m.id)}
                    className={`merchant-card ${m.id === merchant.id ? 'selected' : ''}`}
                  >
                    <div className="merchant-top">
                      <span>{m.zone}</span>
                      <span>★ {m.rating}</span>
                    </div>
                    <strong>{m.name}</strong>
                    <small>{m.courier} • تجهيز {m.prep}</small>
                  </button>
                ))}
              </div>

              <div className="stages-grid">
                {STAGES.map((st, idx) => (
                  <div
                    key={st.key}
                    className={`stage-card ${idx <= stageIndex ? 'done' : ''}`}
                  >
                    <div className="merchant-top">
                      <span>0{idx + 1}</span>
                      <span>{idx <= stageIndex ? '✓' : '•'}</span>
                    </div>
                    <strong>{st.label}</strong>
                    <small>{st.desc}</small>
                  </div>
                ))}
              </div>
            </div>
          </section>

          <section id="products" className="section">
            <div className="container">
              <div className="panel-head">
                <div>
                  <span className="kicker">قائمة الأصناف والأسعار</span>
                  <h2>المنتجات <span>والأسعار</span></h2>
                </div>

                <div className="switch-group">
                  <button
                    type="button"
                    className={`switch-btn ${customerType === 'wholesale' ? 'active' : ''}`}
                    onClick={() => setCustomerType('wholesale')}
                  >
                    تاجر (جملة)
                  </button>
                  <button
                    type="button"
                    className={`switch-btn ${customerType === 'retail' ? 'active' : ''}`}
                    onClick={() => setCustomerType('retail')}
                  >
                    عميل قطاعي
                  </button>
                </div>
              </div>

              <div className="toolbar">
                <div className="search-box">
                  <span>🔍</span>
                  <input
                    type="search"
                    value={query}
                    onChange={(e) => setQuery(e.target.value)}
                    placeholder="ابحث عن منتج أو تصنيف..."
                  />
                </div>
                <span style={{ fontSize: 11.5, color: '#94a3b8' }}>
                  التوصيل الحالي: <strong style={{ color: '#6ee7b7' }}>{deliveryFee === 0 ? 'مجاني / استلام' : `${deliveryFee} ج.م`}</strong>
                </span>
              </div>

              <div className="chips-row">
                {categories.map((cat) => (
                  <button
                    key={cat}
                    type="button"
                    onClick={() => setCategory(cat)}
                    className={`chip ${category === cat ? 'active' : ''}`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              <div className="products-grid">
                {filteredProducts.map((product) => (
                  <article key={product.id} className="product-card">
                    <div className="product-media">
                      <span>{product.emoji}</span>
                      <img
                        src={product.image}
                        alt={product.name}
                        loading="lazy"
                        onError={(e) => {
                          e.currentTarget.style.display = 'none';
                        }}
                      />
                    </div>
                    <div className="product-body">
                      <span className="cat">{product.category}</span>
                      <h3>{product.name}</h3>
                      <p>{product.desc}</p>
                      <div className="product-foot">
                        <div>
                          <strong>
                            {getPrice(product)} <small>ج.م / {product.unit}</small>
                          </strong>
                          <small>جملة: {product.wholesale} • قطاعي: {product.retail}</small>
                        </div>
                        <button
                          type="button"
                          className="add-btn"
                          onClick={() => addItem(product)}
                        >
                          + أضف للسلة
                        </button>
                      </div>
                    </div>
                  </article>
                ))}
              </div>
            </div>
          </section>

          <section id="order" className="section">
            <div className="container order-grid">
              <div className="payment-col">
                <span className="kicker">طرق الدفع المعتمدة</span>
                <h2 style={{ margin: '4px 0', fontSize: 26 }}>
                  الدفع عبر <span>إنستاباي والمحفظة</span>
                </h2>
                <p style={{ margin: 0, fontSize: 12, color: '#94a3b8' }}>
                  اختر وسيلة الدفع المناسبة وسجّل طلبك مباشرة إلى قاعدة البيانات.
                </p>

                <div className="info-card">
                  <span>🏦</span>
                  <div>
                    <b>إنستاباي (InstaPay)</b>
                    <small dir="ltr" style={{ textAlign: 'right' }}>{INSTAPAY_NUMBER}</small>
                  </div>
                </div>

                <div className="info-card">
                  <span>👛</span>
                  <div>
                    <b>المحفظة الإلكترونية</b>
                    <small dir="ltr" style={{ textAlign: 'right' }}>{WALLET_NUMBER}</small>
                  </div>
                </div>

                <div className="cart-preview">
                  <div className="cart-row">
                    <span>التاجر:</span>
                    <strong style={{ color: '#6ee7b7' }}>{merchant.name}</strong>
                  </div>
                  <div className="cart-row">
                    <span>الأصناف والسلة:</span>
                    <strong>{totalCount} صنف ({subtotal} ج.م)</strong>
                  </div>
                  <div className="cart-row">
                    <span>رسوم التوصيل:</span>
                    <strong>{deliveryFee === 0 ? 'مجاني / استلام' : `${deliveryFee} ج.م`}</strong>
                  </div>
                  <div className="cart-row" style={{ borderTop: '1px solid rgba(148,163,184,0.2)', paddingTop: 8 }}>
                    <span>الإجمالي النهائي:</span>
                    <strong style={{ color: '#34d399', fontSize: 14 }}>{grandTotal} ج.م</strong>
                  </div>
                </div>
              </div>

              <form onSubmit={submitOrder} className="form-col">
                <h3>إرسال طلب جديد</h3>

                <div className="switch-group">
                  <button
                    type="button"
                    className={`switch-btn ${paymentMethod === 'instapay' ? 'active' : ''}`}
                    onClick={() => setPaymentMethod('instapay')}
                  >
                    إنستاباي ({INSTAPAY_NUMBER})
                  </button>
                  <button
                    type="button"
                    className={`switch-btn ${paymentMethod === 'wallet' ? 'active' : ''}`}
                    onClick={() => setPaymentMethod('wallet')}
                  >
                    المحفظة ({WALLET_NUMBER})
                  </button>
                </div>

                {cart.length > 0 && (
                  <div className="cart-preview">
                    {cart.map((item) => (
                      <div key={item.product.id} className="cart-row">
                        <span>{item.product.name}</span>
                        <div className="qty-controls">
                          <button type="button" onClick={() => updateQty(item.product.id, -1)}>-</button>
                          <strong>{item.qty}</strong>
                          <button type="button" onClick={() => updateQty(item.product.id, 1)}>+</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                <input
                  type="text"
                  value={customerName}
                  onChange={(e) => setCustomerName(e.target.value)}
                  placeholder="اسم العميل *"
                  required
                />
                <input
                  type="tel"
                  value={phone}
                  onChange={(e) => setPhone(e.target.value)}
                  placeholder="رقم الهاتف *"
                  required
                />
                <textarea
                  rows={3}
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  placeholder="ملاحظات الطلب أو الأصناف المطلوبة"
                />
                <button type="submit" disabled={submitting} className="btn-primary">
                  {submitting ? 'جاري الإرسال...' : 'تأكيد وإرسال الطلب'}
                </button>
              </form>
            </div>
          </section>

          <footer>
            <div className="container" style={{ display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12 }}>
              <span>© {new Date().getFullYear()} زاد لينك (ZadLink)</span>
              <a href="#top">العودة للأعلى ↑</a>
            </div>
          </footer>

          {toast && (
            <div className="toast">
              <span>{toast.error ? '⚠️' : '✓'}</span>
              <span>{toast.text}</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
